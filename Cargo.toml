[package]
name = "stable-json-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Bounded deterministic JSON text engine with Node-API bindings"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3"
serde = "1"
serde_json = { version = "1", features = ["raw_value"] }
memchr = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
codegen-units = 1

[[bench]]
name = "engine"
harness = false

