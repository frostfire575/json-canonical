[package]
name = "stable-json-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
stable-json-core = { path = "../core" }
napi = { version = "3", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[lints.rust]
unsafe_code = "deny"
