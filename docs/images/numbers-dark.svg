<text x="36.0" y="48.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#f0eee6" text-anchor="start" font-weight="normal" xml:space="preserve">How canonicalize prints a number</text>
<text x="36.0" y="76.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="14" fill="#c2c0b6" text-anchor="start" font-weight="normal" xml:space="preserve">always what JavaScript&#x27;s String(Number) prints; sortKeys and minify never touch numbers</text>
<text x="48.0" y="144.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="15" fill="#f0eee6" text-anchor="start" font-weight="normal" xml:space="preserve">the token</text>
<text x="52.0" y="182.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#f0eee6" text-anchor="start" font-weight="normal" xml:space="preserve">1.50</text>
<text x="52.0" y="208.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#f0eee6" text-anchor="start" font-weight="normal" xml:space="preserve">113017829008754.13</text>
<text x="340.0" y="186.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#f0eee6" text-anchor="middle" font-weight="normal" xml:space="preserve">15 significant</text>
<text x="340.0" y="205.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#f0eee6" text-anchor="middle" font-weight="normal" xml:space="preserve">digits or fewer?</text>
<text x="532.0" y="98.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="15" fill="#97ab74" text-anchor="start" font-weight="normal" xml:space="preserve">yes: re-spell the digits</text>
<text x="534.0" y="132.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#c2c0b6" text-anchor="start" font-weight="normal" xml:space="preserve">no float parse at all</text>
<text x="534.0" y="160.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#f0eee6" text-anchor="start" font-weight="normal" xml:space="preserve">1.50  -&gt;  1.5</text>
<text x="532.0" y="214.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="15" fill="#5794d8" text-anchor="start" font-weight="normal" xml:space="preserve">no: parse, then Ryu</text>
<text x="534.0" y="246.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#c2c0b6" text-anchor="start" font-weight="normal" xml:space="preserve">nearest double, then the</text>
<text x="534.0" y="266.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#c2c0b6" text-anchor="start" font-weight="normal" xml:space="preserve">shortest digits that round-trip</text>
<text x="534.0" y="290.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8f8d85" text-anchor="start" font-weight="normal" xml:space="preserve">(ported d2d, ECMA-262 ties)</text>
<text x="808.0" y="144.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="15" fill="#f0eee6" text-anchor="start" font-weight="normal" xml:space="preserve">output</text>
<text x="810.0" y="182.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#f0eee6" text-anchor="start" font-weight="normal" xml:space="preserve">1.5</text>
<text x="810.0" y="208.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#f0eee6" text-anchor="start" font-weight="normal" xml:space="preserve">113017829008754.12</text>
<text x="36.0" y="370.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="13" fill="#8f8d85" text-anchor="start" font-weight="normal" xml:space="preserve">15 digits is enough: distinct decimals of that length are distinct doubles.</text>
<text x="36.0" y="350.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="13" fill="#8f8d85" text-anchor="start" font-weight="normal" xml:space="preserve">strictNumbers: true throws ERR_JSON_PRECISION if the printed value would change.</text>
</svg>
