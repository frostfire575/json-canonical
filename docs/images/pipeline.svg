<text x="36.0" y="48.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#141413" text-anchor="start" font-weight="normal" xml:space="preserve">One call, one pass over the bytes</text>
<text x="36.0" y="76.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="14" fill="#5e5d59" text-anchor="start" font-weight="normal" xml:space="preserve">no JavaScript objects get built: the parser writes output while it validates</text>
<text x="50.0" y="108.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="15" fill="#141413" text-anchor="start" font-weight="normal" xml:space="preserve">you pass in</text>
<text x="50.0" y="152.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#141413" text-anchor="start" font-weight="normal" xml:space="preserve">string</text>
<text x="50.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#141413" text-anchor="start" font-weight="normal" xml:space="preserve">Buffer</text>
<text x="50.0" y="200.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#141413" text-anchor="start" font-weight="normal" xml:space="preserve">Uint8Array</text>
<text x="50.0" y="256.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="13" fill="#87867f" text-anchor="start" font-weight="normal" xml:space="preserve">UTF-8 bytes,</text>
<text x="50.0" y="276.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="13" fill="#87867f" text-anchor="start" font-weight="normal" xml:space="preserve">or a JS string</text>
<text x="234.0" y="108.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="15" fill="#141413" text-anchor="start" font-weight="normal" xml:space="preserve">js/index.ts</text>
<text x="236.0" y="150.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#141413" text-anchor="start" font-weight="normal" xml:space="preserve">checks arguments</text>
<text x="236.0" y="170.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#141413" text-anchor="start" font-weight="normal" xml:space="preserve">and options</text>
<text x="236.0" y="212.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5e5d59" text-anchor="start" font-weight="normal" xml:space="preserve">strings of 1 KiB and up:</text>
<text x="236.0" y="232.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#4f86c0" text-anchor="start" font-weight="normal" xml:space="preserve">encodeInto()</text>
<text x="236.0" y="252.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5e5d59" text-anchor="start" font-weight="normal" xml:space="preserve">into a reused buffer</text>
<text x="236.0" y="294.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5e5d59" text-anchor="start" font-weight="normal" xml:space="preserve">native errors become</text>
<text x="236.0" y="314.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#c4623f" text-anchor="start" font-weight="normal" xml:space="preserve">JsonError</text>
<text x="484.0" y="108.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="15" fill="#c4623f" text-anchor="start" font-weight="normal" xml:space="preserve">crates/core  (Rust, no dependencies)</text>
<text x="486.0" y="148.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#141413" text-anchor="start" font-weight="normal" xml:space="preserve">recursive descent parser over UTF-8</text>
<text x="486.0" y="172.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="13" fill="#5e5d59" text-anchor="start" font-weight="normal" xml:space="preserve">the mode decides what each token does:</text>
<text x="488.0" y="202.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#c4623f" text-anchor="start" font-weight="normal" xml:space="preserve">validate</text>
<text x="600.0" y="202.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5e5d59" text-anchor="start" font-weight="normal" xml:space="preserve">writes nothing</text>
<text x="488.0" y="227.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#c4623f" text-anchor="start" font-weight="normal" xml:space="preserve">minify</text>
<text x="600.0" y="227.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5e5d59" text-anchor="start" font-weight="normal" xml:space="preserve">copies tokens</text>
<text x="488.0" y="252.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#c4623f" text-anchor="start" font-weight="normal" xml:space="preserve">sortKeys</text>
<text x="600.0" y="252.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5e5d59" text-anchor="start" font-weight="normal" xml:space="preserve">copies, sorts members</text>
<text x="488.0" y="277.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#c4623f" text-anchor="start" font-weight="normal" xml:space="preserve">canonicalize</text>
<text x="600.0" y="277.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5e5d59" text-anchor="start" font-weight="normal" xml:space="preserve">re-encodes strings, numbers</text>
<text x="488.0" y="302.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#c4623f" text-anchor="start" font-weight="normal" xml:space="preserve">select</text>
<text x="600.0" y="302.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5e5d59" text-anchor="start" font-weight="normal" xml:space="preserve">follows the pointer path</text>
<text x="486.0" y="344.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="13" fill="#87867f" text-anchor="start" font-weight="normal" xml:space="preserve">unsorted objects leave a patch;</text>
<text x="486.0" y="364.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="13" fill="#87867f" text-anchor="start" font-weight="normal" xml:space="preserve">one final copy applies them all</text>
<text x="440.0" y="237.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="11" fill="#87867f" text-anchor="middle" font-weight="normal" xml:space="preserve">Node-API</text>
<text x="850.0" y="108.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="15" fill="#141413" text-anchor="start" font-weight="normal" xml:space="preserve">you get</text>
<text x="850.0" y="152.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#141413" text-anchor="start" font-weight="normal" xml:space="preserve">string</text>
<text x="850.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#141413" text-anchor="start" font-weight="normal" xml:space="preserve">Buffer</text>
<text x="850.0" y="200.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#141413" text-anchor="start" font-weight="normal" xml:space="preserve">boolean</text>
<text x="850.0" y="224.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#141413" text-anchor="start" font-weight="normal" xml:space="preserve">undefined</text>
<text x="850.0" y="276.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="12" fill="#87867f" text-anchor="start" font-weight="normal" xml:space="preserve">Buffers of</text>
<text x="850.0" y="294.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="12" fill="#87867f" text-anchor="start" font-weight="normal" xml:space="preserve">64 KiB+ wrap</text>
<text x="850.0" y="312.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="12" fill="#87867f" text-anchor="start" font-weight="normal" xml:space="preserve">Rust memory</text>
<text x="850.0" y="330.0" font-family="'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Neue', 'Comic Sans MS', cursive" font-size="12" fill="#87867f" text-anchor="start" font-weight="normal" xml:space="preserve">(no copy)</text>
