name: Verify and package (no publishing)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, host: win32/x64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, host: linux/x64 }
          - { os: macos-15, target: aarch64-apple-darwin, host: darwin/arm64 }
        node: [22.13.0, 24]
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.10.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, explicit stable below
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check actual build host
        run: node -e "require('node:assert/strict').equal(process.platform + '/' + process.arch, '${{ matrix.platform.host }}')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.node == 24
        with:
          archive: true
          name: native-${{ matrix.platform.target }}
          path: native/*.node
          if-no-files-found: error
