name: Release
# A v* tag publishes to npm. A manual run does everything except the upload
# (npm publish --dry-run), so the pipeline can be checked without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  BUILD_NODE: 24.22.1
jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.BUILD_NODE }}
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.10.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:js
      # The addons come from the verify matrix, so the published binaries are the
      # ones that passed the tests on their own platform.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: native
          merge-multiple: true
      - name: Check the tag, the version and the addons
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi
          ls -l native
          for addon in win32-x64-msvc linux-x64-gnu darwin-arm64; do
            test -f "native/stable-json-rs.$addon.node" || { echo "missing $addon addon"; exit 1; }
          done
      - run: pnpm test
      - run: pnpm test:pack
      - name: Check the tarball holds all three addons
        run: |
          count=$(npm pack --dry-run --json | node -e "const [p] = JSON.parse(require('fs').readFileSync(0)); console.log(p.files.filter(f => f.path.endsWith('.node')).length)")
          test "$count" = 3 || { echo "tarball has $count addons, expected 3"; exit 1; }
      - name: Publish
        run: npm publish --provenance --access public ${{ github.ref_type != 'tag' && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
